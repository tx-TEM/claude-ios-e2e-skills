appId: jp.example.App
---
# 続き: list から
- extendedWaitUntil:
    visible:
      id: '^list$'
    timeout: 10000
# 次で使う list.row.* が見えるまでスクロールして止める（ここで押すものを決める）
- scrollUntilVisible:
    element:
      id: '^list\.row\..*'
    direction: DOWN
    timeout: 60000
    optional: true
- scrollUntilVisible:
    element:
      id: '^list\.row\..*'
    direction: UP
    timeout: 60000
