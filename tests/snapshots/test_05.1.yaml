appId: jp.example.App
---
- stopApp
- launchApp
# 起点: home
- extendedWaitUntil:
    visible:
      id: '^home$'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
# home: tap home.list — 作品の一覧を開く → list
- scrollUntilVisible:
    element:
      id: '^home\.list$'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: '^home\.list$'
- extendedWaitUntil:
    visible:
      id: '^list$'
    timeout: 10000
# list: 読み込み完了（どれか1つ）
- extendedWaitUntil:
    visible:
      id: '(^list\.row\..*|^list\.empty_view$)'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
# 次で使う list.row.* が見えるまでスクロールして止める（ここで押すものを決める）
- scrollUntilVisible:
    element:
      id: '^list\.row\..*'
    direction: DOWN
    timeout: 60000
