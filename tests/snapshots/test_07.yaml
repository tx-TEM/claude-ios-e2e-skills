appId: jp.example.App
env:
  SHOTS: ''
  LIST_ROW: ''
  LIST_ROW_INDEX: ''
---
# 続き: list から
- extendedWaitUntil:
    visible:
      id: '^list$'
    timeout: 10000
# list: tap list.row.* [見えている1件目] — 作品の詳細を開く → detail
- tapOn:
    id: '^list\.row\.${LIST_ROW}$'
    index: ${LIST_ROW_INDEX}
- extendedWaitUntil:
    visible:
      id: '^detail$'
    timeout: 10000
# detail: 読み込み完了（全部）
- extendedWaitUntil:
    visible:
      id: '^detail\.title$'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
# detail: tap detail.favorite_button — 作品をお気に入りに登録する（アカウントに保存される）
- scrollUntilVisible:
    element:
      id: '^detail\.favorite_button$'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: '^detail\.favorite_button$'
- extendedWaitUntil:
    visible:
      id: '^detail\.favorite_button$'
      selected: true
    timeout: 10000
# detail: tap detail.share_button — Safari で作品のページを開く
- scrollUntilVisible:
    element:
      id: '^detail\.share_button$'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: '^detail\.share_button$'
# アプリの外（safari）に出る。確かめずにアプリに戻す
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: '^detail$'
    timeout: 10000
- takeScreenshot: '${SHOTS}/test_07'
