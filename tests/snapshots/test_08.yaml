appId: jp.example.App
env:
  SHOTS: ''
---
# 続き: アプリの外から
# アプリの外から detail に戻す
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: '^detail$'
    timeout: 10000
# detail: tap detail.review_button — レビューを書く画面を開く → login_alert
- scrollUntilVisible:
    element:
      id: '^detail\.review_button$'
    direction: DOWN
    timeout: 60000
    optional: true
- scrollUntilVisible:
    element:
      id: '^detail\.review_button$'
    direction: UP
    timeout: 60000
- tapOn:
    id: '^detail\.review_button$'
- extendedWaitUntil:
    visible:
      id: '^login_alert$'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: '${SHOTS}/test_08'
