appId: jp.example.App
env:
  SHOTS: ''
  LIST_ROW: ''
---
# 続き: list から
- extendedWaitUntil:
    visible:
      id: '^list$'
    timeout: 10000
# list: tap list.row.* [見えている1件目] — 作品の詳細を開く → detail
- tapOn:
    id: '^list\.row\.${LIST_ROW}$'
- extendedWaitUntil:
    visible:
      id: '^detail$'
    timeout: 10000
# detail: 読み込み完了（全部）
- extendedWaitUntil:
    visible:
      id: '^detail\.title$'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: '${SHOTS}/test_05'
