appId: jp.example.App
---
# 続き: list から
- extendedWaitUntil:
    visible:
      id: '^list$'
    timeout: 10000
# list: list.search_field が画面にあることは run_flows.py が確かめてある
# 次で使う list.search_field が見えるまでスクロールして止める（ここで打つ文字を決める）
- scrollUntilVisible:
    element:
      id: '^list\.search_field$'
    direction: DOWN
    timeout: 60000
