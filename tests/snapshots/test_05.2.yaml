appId: jp.example.App
---
# 続き: list から
- extendedWaitUntil:
    visible:
      id: '^list$'
    timeout: 10000
# list: list.row.* が画面にあることは run_flows.py が確かめてある
# 次で使う list.row.* が見えるまでスクロールして止める（ここで押すものを決める）
- scrollUntilVisible:
    element:
      id: '^list\.row\..*'
    direction: DOWN
    timeout: 60000
