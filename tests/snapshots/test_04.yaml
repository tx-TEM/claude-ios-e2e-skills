appId: jp.example.App
env:
  SHOTS: ''
---
# 続き: list から
- extendedWaitUntil:
    visible:
      id: '^list$'
    timeout: 10000
# list: list.footer が画面にあることは run_flows.py が確かめてある
# list: see list.footer — 一覧の末尾
- scrollUntilVisible:
    element:
      id: '^list\.footer$'
    direction: DOWN
    centerElement: true
    timeout: 60000
    optional: true
- scrollUntilVisible:
    element:
      id: '^list\.footer$'
    direction: UP
    timeout: 60000
- takeScreenshot: '${SHOTS}/test_04'
