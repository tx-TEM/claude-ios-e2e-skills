appId: jp.example.App
env:
  SHOTS: ''
---
# 続き: detail から
- extendedWaitUntil:
    visible:
      id: '^detail$'
    timeout: 10000
# detail: BackButton が画面にあることは run_flows.py が確かめてある
# detail: tap BackButton — 前の画面に戻る → list
- scrollUntilVisible:
    element:
      id: '^BackButton$'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: '^BackButton$'
- extendedWaitUntil:
    visible:
      id: '^list$'
    timeout: 10000
# list: 読み込み完了（どれか1つ）
- extendedWaitUntil:
    visible:
      id: '(^list\.row\..*|^list\.empty_view$)'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: '${SHOTS}/test_06'
