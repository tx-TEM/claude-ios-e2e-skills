appId: jp.example.App
---
# detail: tap BackButton — 前の画面に戻る → list
- tapOn:
    id: '^BackButton$'
- extendedWaitUntil:
    visible:
      id: '^list$'
    timeout: 10000
# list: 読み込み完了（どれか1つ）
- extendedWaitUntil:
    visible:
      id: '(^list\.row\..*|^list\.empty_view$)'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: '/shots/test_06'
